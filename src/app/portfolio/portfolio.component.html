<div class="portfolio-container">
  <!-- Minimalist Series Filter (Clean typographic navigation, zero boxy pills) -->
  <nav class="series-nav" aria-label="Photo series filter">
    <button 
      type="button" 
      class="series-link" 
      [class.active]="selectedCategory() === 'all'"
      (click)="setCategory('all')">
      {{ localeService.dict().home.filterAll }}
    </button>
    <span class="series-sep" aria-hidden="true">/</span>
    <button 
      type="button" 
      class="series-link" 
      [class.active]="selectedCategory() === 'street'"
      (click)="setCategory('street')">
      {{ localeService.dict().home.filterStreet }}
    </button>
    <span class="series-sep" aria-hidden="true">/</span>
    <button 
      type="button" 
      class="series-link" 
      [class.active]="selectedCategory() === 'travel'"
      (click)="setCategory('travel')">
      {{ localeService.dict().home.filterTravel }}
    </button>
    <span class="series-sep" aria-hidden="true">/</span>
    <button 
      type="button" 
      class="series-link" 
      [class.active]="selectedCategory() === 'still_life'"
      (click)="setCategory('still_life')">
      {{ localeService.dict().home.filterQuiet }}
    </button>
  </nav>

  <!-- Pure Photo Stream (Direct visual impact, zero captions, zero cards) -->
  <main class="photo-stream-wrapper" aria-label="Photo gallery">
    <div class="photo-stream">
      @for (image of filteredImages(); track image.id; let i = $index) {
        <figure class="photo-item">
          <a 
            [href]="getFullSizeUrl(image)"
            data-fancybox="gallery"
            class="photo-link"
            [attr.aria-label]="image.alt">
            <img 
              [src]="getDisplayUrl(image)"
              [width]="getDisplayWidth(image)"
              [height]="getDisplayHeight(image)"
              [alt]="image.alt"
              loading="lazy"
              decoding="async"
              class="photo-img" />
          </a>
        </figure>
      }
    </div>
  </main>
</div>
